services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplychainx
      POSTGRES_USER: supplychainx
      POSTGRES_PASSWORD: supplychainx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychainx -d supplychainx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file: .env
    environment:
      DATABASE_URL: postgresql://supplychainx:supplychainx@db:5432/supplychainx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info -Q celery,scans,maintenance --concurrency=2
    volumes:
      - media_data:/app/media
    env_file: .env
    environment:
      DATABASE_URL: postgresql://supplychainx:supplychainx@db:5432/supplychainx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
